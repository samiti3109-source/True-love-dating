<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>True Love</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121214;
      --border-color: #2c2c2e;
      --primary-color: #d0d0d3;
      --primary-grad: linear-gradient(135deg, #3a3a3c, #202022);
      --text-color: #ffffff;
      --subtext-color: #9a9a9d;
      --input-bg: #1c1c1e;
      --accent-green: #38ef7d;
      --accent-gold: #ffb703;
      --accent-red: #ff3b5c;
    }

    body.light-mode {
      --bg-color: #f0f4f9;
      --card-bg: #ffffff;
      --border-color: #d1dbe8;
      --text-color: #0a192f;
      --subtext-color: #5a6e85;
      --input-bg: #f8fafc;
    }

    body.theme-pink {
      --primary-color: #ff2a6d;
      --primary-grad: linear-gradient(135deg, #ff2a6d, #ff5e62);
    }
    body.theme-ocean {
      --primary-color: #00b4d8;
      --primary-grad: linear-gradient(135deg, #0077b6, #00b4d8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body { display: flex; flex-direction: column; }

    /* Header */
    .header {
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
      z-index: 10;
      flex-shrink: 0;
    }
    .logo { font-size: 18px; font-weight: 800; color: var(--text-color); letter-spacing: 0.5px; }
    .logo span { color: #e5e5e7; }
    .controls-top { display: flex; gap: 6px; align-items: center; }
    .top-btn {
      background: var(--input-bg); border: 1px solid var(--border-color);
      color: var(--text-color); padding: 5px 9px; border-radius: 8px;
      font-size: 12px; cursor: pointer; font-weight: 500;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Swipe Card View */
    .profile-card {
      width: 100%;
      max-width: 330px;
      height: 430px;
      background: var(--card-bg);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .card-img-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #091326; display: flex; align-items: center; justify-content: center;
    }
    .card-img { width: 100%; height: 100%; object-fit: cover; }

    .card-info {
      position: relative; z-index: 2; padding: 20px 18px;
      background: linear-gradient(to top, rgba(5, 11, 24, 0.95) 50%, rgba(5, 11, 24, 0.4) 85%, transparent);
      color: #ffffff; text-align: left;
    }

    .actions { display: flex; gap: 25px; margin-top: 15px; margin-bottom: 20px; flex-shrink: 0; }
    .btn {
      width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 22px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.9); }
    .btn-dislike { background: var(--card-bg); color: #ff4757; border: 2px solid #ff4757; }
    .btn-like { background: var(--primary-grad); color: white; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25); }

    /* Form Container */
    .form-container {
      width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 120px;
    }

    /* "Create Profile" header with decorative progress dashes */
    .form-header-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px; gap: 14px;
    }
    .form-title-lg { font-size: 24px; font-weight: 800; color: var(--text-color); white-space: nowrap; }
    .progress-dashes { display: flex; gap: 5px; flex-shrink: 0; }
    .progress-dash { width: 28px; height: 4px; border-radius: 4px; background: var(--border-color); }
    .progress-dash.active { background: var(--text-color); }

    .form-section-title {
      font-size: 13px; font-weight: bold; color: #e5e5e7;
      margin-top: 8px; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .form-hint { font-size: 12px; color: var(--subtext-color); padding: 0 6px; }
    label { font-size: 13px; color: var(--subtext-color); font-weight: 500; }

    /* Pill-shaped inputs (rounded like a capsule, no boxed label above) */
    input, textarea, select {
      background: var(--input-bg); border: 1px solid var(--border-color); padding: 16px 20px; color: var(--text-color);
      border-radius: 30px; font-size: 15px; outline: none; width: 100%;
    }
    textarea { border-radius: 22px; }
    input:focus, textarea:focus, select:focus { border-color: #e5e5e7; }
    input::placeholder, textarea::placeholder { color: var(--subtext-color); }

    select {
      appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239a9a9d' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat: no-repeat; background-position: right 20px center; padding-right: 46px;
    }

    /* Fields with a leading icon inside the pill, e.g. 📍 city, 🎂 DOB */
    .pill-field { position: relative; }
    .pill-field .pill-icon {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      font-size: 16px; pointer-events: none; z-index: 1;
    }
    .pill-field input, .pill-field select { padding-left: 48px; }

    /* Gender toggle pills (radio-style, side by side) */
    .gender-toggle-row { display: flex; gap: 12px; }
    .gender-pill {
      flex: 1; display: flex; align-items: center; gap: 10px;
      background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 30px;
      padding: 14px 18px; color: var(--text-color); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .gender-pill.active { border-color: #e5e5e7; background: rgba(255, 255, 255, 0.14); }
    .gender-radio-dot {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--subtext-color);
      display: inline-block; position: relative; flex-shrink: 0;
    }
    .gender-pill.active .gender-radio-dot { border-color: #e5e5e7; }
    .gender-pill.active .gender-radio-dot::after {
      content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #e5e5e7;
    }

    .action-input-btn {
      background: var(--input-bg); border: 1px solid var(--border-color);
      color: #c7c7cc; padding: 11px; border-radius: 30px;
      font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .action-input-btn:active { background: var(--border-color); }

    .file-upload-wrapper {
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      background: var(--input-bg); border: 2px dashed var(--border-color); padding: 16px;
      border-radius: 22px; cursor: pointer; text-align: center;
    }
    .preview-img {
      width: 70px; height: 70px; border-radius: 50%; object-fit: cover; display: none;
      border: 2px solid #e5e5e7;
    }

    .save-btn {
      background: var(--primary-grad); color: white; border: none; padding: 16px;
      border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); transition: opacity 0.15s, box-shadow 0.15s;
    }
    .save-btn:disabled {
      background: var(--input-bg); color: var(--subtext-color); box-shadow: none; cursor: not-allowed;
    }

    .matches-container { width: 100%; max-width: 330px; display: none; flex-direction: column; gap: 10px; padding-bottom: 100px; }
    .match-item {
      display: flex; align-items: center; gap: 12px; background: var(--card-bg);
      padding: 12px; border-radius: 14px; border: 1px solid var(--border-color);
    }
    .match-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .match-chat-btn {
      margin-left: auto; background: var(--primary-grad); color: white; border: none;
      padding: 7px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold;
    }

    .nav-bar {
      display: flex; justify-content: space-around; background: var(--card-bg);
      padding: 14px 0; border-top: 1px solid var(--border-color); z-index: 10; flex-shrink: 0;
    }
    .nav-item { color: var(--subtext-color); font-size: 20px; cursor: pointer; }
    .nav-item.active { color: #c7c7cc; }

    /* Report button on the swipe card */
    .report-flag-btn {
      position: absolute; top: 14px; right: 14px; z-index: 3;
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(5, 11, 24, 0.55); color: #ff9f43; font-size: 16px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .report-flag-btn:active { transform: scale(0.9); }

    /* Profile display card v2: gradient cover banner + centered overlapping avatar */
    .profile-display-container {
      width: 100%; max-width: 330px; display: none; flex-direction: column;
      align-items: center; gap: 16px; padding-bottom: 110px;
    }
    .premium-card {
      width: 100%; background: var(--card-bg); border-radius: 26px;
      border: 1px solid var(--border-color); overflow: visible;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.45); position: relative;
    }
    .profile-cover-banner {
      width: 100%; height: 110px; border-radius: 26px 26px 0 0;
      background: var(--primary-grad); position: relative; overflow: hidden;
    }
    .profile-avatar-wrap {
      display: flex; justify-content: center; margin-top: -50px; position: relative; z-index: 2;
    }
    .profile-avatar-lg {
      width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--card-bg); background: #091326;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .premium-card-name-row {
      display: flex; align-items: baseline; justify-content: center; gap: 8px;
      margin-top: 10px;
    }
    .premium-card-name { font-size: 22px; font-weight: 800; color: var(--text-color); }
    .premium-card-age { font-size: 18px; font-weight: 600; color: var(--subtext-color); }

    .premium-card-body {
      padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .profile-detail-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--input-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 11px 14px; font-size: 13px;
    }
    .profile-detail-row .detail-icon { font-size: 15px; flex-shrink: 0; }
    .profile-detail-row .detail-label {
      font-size: 10px; color: var(--subtext-color); font-weight: 700; letter-spacing: 0.3px;
      display: block; margin-bottom: 2px;
    }
    .profile-detail-row .detail-value { font-weight: 600; color: var(--text-color); }

    .premium-bio-box {
      background: var(--input-bg); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 14px; font-size: 13px; line-height: 1.6; color: var(--text-color);
    }
    .premium-bio-label { font-size: 11px; color: var(--subtext-color); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.4px; }

    .edit-profile-btn {
      width: 100%; background: var(--primary-grad); color: white; border: none;
      padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="header">
    <div class="logo">TRUE <span>LOVE</span></div>
    <div class="controls-top">
      <button class="top-btn" onclick="toggleMode()" id="mode-btn">🌙 Dark</button>
      <button class="top-btn" onclick="toggleLanguage()" id="lang-btn">🇪🇹 AM</button>
      <button class="top-btn" onclick="toggleTheme()">🎨 Color</button>
    </div>
  </div>

  <!-- App Container -->
  <div class="container">
    
    <!-- 1. SWIPE VIEW -->
    <div id="swipe-view" style="display: none; flex-direction: column; align-items: center;">
      <div class="profile-card">
        <button class="report-flag-btn" onclick="reportUser()" title="Report">🚨</button>
        <div class="card-img-container">
          <img id="profile-img" class="card-img" src="" alt="Profile" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/847/847969.png';">
        </div>
        <div class="card-info">
          <div style="font-size: 22px; font-weight: bold;" id="card-name">...</div>
          <div style="font-size: 13px; color: #c7c7cc; margin-top: 3px;" id="card-religion-zodiac">...</div>
          <div style="font-size: 13px; color: #cbd5e1; margin-top: 5px; line-height: 1.3;" id="card-bio">...</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-dislike" onclick="nextProfile('pass')">✖</button>
        <button class="btn btn-like" onclick="nextProfile('like')">❤️</button>
      </div>
    </div>

    <!-- 2. MATCHES VIEW -->
    <div id="matches-view" class="matches-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <h3 id="txt-matches-title">Matches</h3>
      </div>
      <div id="matches-list"></div>
    </div>

    <!-- 3. PROFILE REGISTER/EDIT VIEW -->
    <div id="profile-view" class="form-container">
      <div class="form-header-row">
        <h3 class="form-title-lg" id="txt-edit-title">Register First</h3>
        <div class="progress-dashes">
          <span class="progress-dash active"></span>
          <span class="progress-dash"></span>
          <span class="progress-dash"></span>
        </div>
      </div>

      <!-- User Info -->
      <div class="form-group">
        <input type="text" id="my-input-name" placeholder="Name" oninput="updateContinueButtonState()">
      </div>

      <div class="form-group">
        <textarea id="my-input-bio" rows="2" placeholder="I like movies..." maxlength="120"></textarea>
        <div class="form-hint" id="txt-bio-hint">Example: Designer from Dubai. Love surfing. Max. 120 characters</div>
      </div>

      <div class="form-group pill-field">
        <span class="pill-icon">🎂</span>
        <input type="number" id="my-input-age" placeholder="Age (18+)" oninput="updateContinueButtonState()">
      </div>

      <div class="form-group pill-field">
        <span class="pill-icon">📍</span>
        <input type="text" id="my-input-location" placeholder="Your city">
        <button type="button" class="action-input-btn" id="btn-gps-location" onclick="requestGPSLocation()">
          📍 Get Live GPS Location
        </button>
      </div>

      <div class="form-group">
        <label id="lbl-gender-hdr" style="text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">Gender</label>
        <div class="gender-toggle-row">
          <button type="button" class="gender-pill" id="gender-btn-male" onclick="selectGender('Male')">
            <span class="gender-radio-dot"></span> <span id="lbl-gender-male">Male</span>
          </button>
          <button type="button" class="gender-pill active" id="gender-btn-female" onclick="selectGender('Female')">
            <span class="gender-radio-dot"></span> <span id="lbl-gender-female">Female</span>
          </button>
        </div>
        <input type="hidden" id="my-input-gender" value="Female">
      </div>

      <!-- Contact -->
      <div class="form-section-title" id="txt-contact-loc-title">📞 Contact</div>

      <div class="form-group">
        <input type="text" id="my-input-phone" placeholder="+251912345678">
        <button type="button" class="action-input-btn" id="btn-share-phone" onclick="requestTelegramContact()">
          📱 Share Telegram Phone Number
        </button>
      </div>

      <!-- Preferences -->
      <div class="form-section-title" id="txt-pref-title">🎯 Preferences</div>

      <div class="form-group">
        <label id="lbl-looking-for">I am looking for</label>
        <select id="my-pref-looking">
          <option value="Male" id="opt-look-male">Male</option>
          <option value="Female" id="opt-look-female">Female</option>
          <option value="Both" id="opt-look-both">Both</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lbl-pref-age">Preferred Age Range</label>
        <select id="my-pref-age">
          <option value="18-25">18 - 25</option>
          <option value="26-35">26 - 35</option>
          <option value="36+">36+</option>
          <option value="Any" id="opt-age-any">Any Age</option>
        </select>
      </div>

      <!-- Religion -->
      <div class="form-group">
        <label id="lbl-religion">Religion</label>
        <select id="my-input-religion" onchange="toggleManualReligionInput()">
          <option value="Orthodox" id="opt-rel-orthodox">Orthodox</option>
          <option value="Protestant" id="opt-rel-protestant">Protestant</option>
          <option value="Muslim" id="opt-rel-muslim">Muslim</option>
          <option value="Catholic" id="opt-rel-catholic">Catholic</option>
          <option value="MANUAL" id="opt-rel-manual">✍️ Type manually</option>
        </select>
        <input type="text" id="my-input-religion-manual" placeholder="Type your religion..." style="display: none; margin-top: 5px;">
      </div>

      <!-- Zodiac Sign (የተጨመረው የኮከብ ምልክት) -->
      <div class="form-group">
        <label id="lbl-zodiac">Zodiac Sign</label>
        <select id="my-input-zodiac">
          <option value="Aries ♈" id="opt-z-aries">Aries ♈ (አሪየስ)</option>
          <option value="Taurus ♉" id="opt-z-taurus">Taurus ♉ (ታውረስ)</option>
          <option value="Gemini ♊" id="opt-z-gemini">Gemini ♊ (ጄሚኒ)</option>
          <option value="Cancer ♋" id="opt-z-cancer">Cancer ♋ (ካንሰር)</option>
          <option value="Leo ♌" id="opt-z-leo">Leo ♌ (ሊዮ)</option>
          <option value="Virgo ♍" id="opt-z-virgo">Virgo ♍ (ቪርጎ)</option>
          <option value="Libra ♎" id="opt-z-libra">Libra ♎ (ሊብራ)</option>
          <option value="Scorpio ♏" id="opt-z-scorpio">Scorpio ♏ (ስኮርፒዮ)</option>
          <option value="Sagittarius ♐" id="opt-z-sagittarius">Sagittarius ♐ (ሳጂታሪየስ)</option>
          <option value="Capricorn ♑" id="opt-z-capricorn">Capricorn ♑ (ካፕሪኮርን)</option>
          <option value="Aquarius ♒" id="opt-z-aquarius">Aquarius ♒ (አኳሪየስ)</option>
          <option value="Pisces ♓" id="opt-z-pisces">Pisces ♓ (ፓይሰስ)</option>
        </select>
      </div>

      <!-- Photo -->
      <div class="form-group">
        <label id="lbl-photo">Choose Photo</label>
        <div class="file-upload-wrapper" onclick="document.getElementById('my-file-input').click()">
          <img id="my-photo-preview" class="preview-img" alt="Preview">
          <span id="txt-file-status" style="font-size: 13px; color: var(--subtext-color);">📷 Select Photo</span>
        </div>
        <input type="file" id="my-file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
      </div>

      <button class="save-btn" id="btn-save" onclick="saveMyProfile()">Continue</button>
    </div>

    <!-- 3b. PROFILE DISPLAY VIEW (premium card, shown once a profile is saved) -->
    <div id="profile-display-view" class="profile-display-container">
      <div class="premium-card">
        <div class="profile-cover-banner"></div>
        <div class="profile-avatar-wrap">
          <img id="pd-photo" class="profile-avatar-lg" src="" alt="Profile photo"
               onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/847/847969.png';">
        </div>
        <div class="premium-card-name-row">
          <span class="premium-card-name" id="pd-name">-</span>
          <span class="premium-card-age" id="pd-age"></span>
        </div>
        <div class="premium-card-body">
          <div class="profile-detail-row">
            <span class="detail-icon">📍</span>
            <div>
              <span class="detail-label" id="pd-lbl-location">LOCATION</span>
              <span class="detail-value" id="pd-location">-</span>
            </div>
          </div>
          <div class="profile-detail-row">
            <span class="detail-icon">📱</span>
            <div>
              <span class="detail-label" id="pd-lbl-phone">PHONE</span>
              <span class="detail-value" id="pd-phone">-</span>
            </div>
          </div>
          <div class="premium-bio-box">
            <div class="premium-bio-label" id="pd-lbl-bio">ABOUT ME</div>
            <div id="pd-bio">-</div>
          </div>
        </div>
      </div>
      <button class="edit-profile-btn" id="btn-edit-profile" onclick="editMyProfile()">✏️ Edit Profile</button>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="nav-bar">
    <div class="nav-item" id="nav-home" onclick="switchTab('home')">🔥</div>
    <div class="nav-item" id="nav-matches" onclick="switchTab('matches')">💬</div>
    <div class="nav-item active" id="nav-profile" onclick="switchTab('profile')">👤</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // This page is hosted on GitHub Pages, separate from the Flask/bot
    // backend. Telegram's tg.sendData() is capped at 4096 bytes, which a
    // base64 photo will always exceed, so the photo is uploaded straight
    // to the backend over HTTP instead. Point this at your deployed

    function handleFileSelect(e) {

        e.target.value = "";
        return;
      }

      selectedPhotoFile = file;
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedPhotoBase64 = evt.target.result;
        const preview = document.getElementById('my-photo-preview');
        preview.src = uploadedPhotoBase64;

    // Uploads the photo directly to the Flask backend (bypasses the
    // 4096-byte cap on tg.sendData()). Returns true on success.
    async function uploadPhotoToServer(userId) {
      if (!selectedPhotoFile || !uploadedPhotoBase64) return true; // nothing to upload
      try {
        const res = await fetch(`${BACKEND_URL}/upload_photo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, photo_base64: uploadedPhotoBase64 })
        });
        const result = await res.json().catch(() => ({}));
        return res.ok && result.ok;
      } catch (err) {
        console.error('Photo upload failed:', err);
        return false;
      }
    }

    const saveBtn = document.getElementById('btn-save');

    if (!userId) {
        tg.showAlert(currentLang === 'am' ? 'ይህን ገጽ በቴሌግራም ውስጥ ብቻ ይክፈቱ።' : 'Please open this inside Telegram to save your profile.');
        return;
    }

    saveBtn.disabled = true;
    const originalLabel = saveBtn.innerText;

    // 2. 📸 Upload the photo first (direct HTTP - tg.sendData() cannot
    // carry a base64 photo, it's capped at 4096 bytes).
    let photoOk = true; // true when there's nothing to upload
    if (selectedPhotoFile) {
        saveBtn.innerText = currentLang === 'am' ? 'ፎቶ በመላክ ላይ...' : 'Uploading photo...';
        photoOk = await uploadPhotoToServer(userId);
    }

    if (!photoOk) {
        saveBtn.disabled = false;
        saveBtn.innerText = originalLabel;
        tg.showAlert(currentLang === 'am' ? '⚠️ ፎቶውን መላክ አልተቻለም። እባክዎን እንደገና ይሞክሩ።' : '⚠️ Could not upload the photo. Please try again.');
        return; // do NOT redirect - photo upload failed
    }

    // 3. 💾 Save the text profile - over HTTP, not tg.sendData(). sendData()
    // closes the Mini App immediately, which would make it impossible to
    // show a success message and redirect to Discover from inside the app.
    const userProfile = {
        action: "save_profile",
        user_id: userId,
        name: name,
        age: age,
        gender: gender,
        phone: phone,
        location: location,
        lookingFor: lookingFor,
        prefAge: prefAge,
        religion: religionSelect,
        zodiac: zodiac,
        bio: bio,
        registeredAt: new Date().toISOString()
    };

    saveBtn.innerText = currentLang === 'am' ? 'በማስቀመጥ ላይ...' : 'Saving...';
    let profileOk = false;
    try {
        const res = await fetch(`${BACKEND_URL}/save_profile`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userProfile)
        });
        const result = await res.json().catch(() => ({}));
        profileOk = res.ok && result.ok;
    } catch (err) {
        console.error('Profile save failed:', err);
        profileOk = false;
    }

    saveBtn.disabled = false;
    saveBtn.innerText = originalLabel;

    if (!profileOk) {
        tg.showAlert(currentLang === 'am' ? '⚠️ ፕሮፋይልዎን ማስቀመጥ አልተቻለም። እባክዎን እንደገና ይሞክሩ።' : '⚠️ Could not save your profile. Please try again.');
        return; // do NOT redirect - profile save failed
    }

    // 4. 💽 Keep a local cache too (fast prefill / preview), not the
    // source of truth - the database row saved above is.
    localStorage.setItem('user_profile', JSON.stringify({ ...userProfile, photo: uploadedPhotoBase64 }));

    // 5. 📡 Best-effort legacy notification via tg.sendData(). NOTE: on a
    // real Telegram client, calling WebApp.sendData() sends the payload to
    // the bot's web_app_data handler AND immediately closes the Mini App -
    // that's Telegram's own platform behavior, not a bug here. The profile
    // is already safely saved via the HTTP call above, so it's fine if the
    // app closes right after this - nothing is lost either way.
    try {
        tg.sendData(JSON.stringify({ action: 'save_profile', ...userProfile }));
    } catch (err) {
        console.warn('tg.sendData unavailable (e.g. testing outside Telegram):', err);
    }

    // 6. ✅ Show a clean success alert, then redirect to the Home / Swipe
    // view once the user dismisses it (falls back to a plain alert() if
    // tg.showAlert isn't available, e.g. when testing in a normal browser).
    forceProfileEditMode = false;
    applyLanguage();
    const successMsg = currentLang === 'am' ? '🎉 ፕሮፋይልዎ በስኬት ተቀምጧል!' : '🎉 Your profile was saved successfully!';
    if (tg.showAlert) {
        tg.showAlert(successMsg, () => switchTab('home'));
    } else {
        alert(successMsg);
        switchTab('home');
    }
}

    function fillProfileForm(p) {
      document.getElementById('my-input-name').value = p.name || '';
      document.getElementById('my-input-age').value = p.age || '';
      selectGender(p.gender || 'Female');
      document.getElementById('my-input-phone').value = p.phone || '';
      document.getElementById('my-input-location').value = p.location || '';
      document.getElementById('my-pref-looking').value = p.lookingFor || p.looking_for || 'Male';
      document.getElementById('my-pref-age').value = p.prefAge || p.pref_age || '18-25';
      document.getElementById('my-input-zodiac').value = p.zodiac || 'Aries ♈';
      document.getElementById('my-input-bio').value = p.bio || '';
      if (p.photo) {
        uploadedPhotoBase64 = p.photo;
        const preview = document.getElementById('my-photo-preview');
        preview.src = p.photo;
        preview.style.display = 'block';
      }
      updateContinueButtonState();
    }

    // Gender toggle pills (replaces the old <select>) - keeps the same
    // hidden #my-input-gender value so saveMyProfile()/loadMyProfile() work unchanged.
    function selectGender(value) {
      document.getElementById('my-input-gender').value = value;
      document.getElementById('gender-btn-male').classList.toggle('active', value === 'Male');
      document.getElementById('gender-btn-female').classList.toggle('active', value === 'Female');
      updateContinueButtonState();
    }

    // Enables/greys out the Continue button based on the two required
    // fields (Name + Age), mirroring the reference design's disabled state.
    function updateContinueButtonState() {
      const name = document.getElementById('my-input-name').value.trim();
      const age = document.getElementById('my-input-age').value.trim();
      const saveBtn = document.getElementById('btn-save');
      saveBtn.disabled = !(name && age);
    }

    async function loadMyProfile() {
      const userId = tg.initDataUnsafe?.user?.id;
      const cached = localStorage.getItem('user_profile');

      // Prefill instantly from the local cache if present, so the form
      // isn't empty while the network check below is in flight.
      if (cached) fillProfileForm(JSON.parse(cached));

      if (userId) {
        try {
          const res = await fetch(`${BACKEND_URL}/profile/${userId}`);
          const result = await res.json();
          if (result.ok && result.exists) {
            fillProfileForm(result.profile);
            // Cache the server profile locally too (even on a device that
            // never saved it before) so `isSaved` checks and the display
            // card work correctly right away. Note: the server doesn't
            // return the photo bytes here, only whether one exists - the
            // local cache's photo (if any) is preserved via `cached` above.
            const existingCache = cached ? JSON.parse(cached) : {};
            localStorage.setItem('user_profile', JSON.stringify({
              ...existingCache,
              ...result.profile,
              user_id: userId,
              registeredAt: existingCache.registeredAt || new Date().toISOString(),
            }));
            switchTab('home'); // already has a profile - go straight to Discover
            return;
          } else if (result.ok && !result.exists) {
            switchTab('profile');
            return;
          }
          // On an unexpected response, fall through to the local-storage check below.
        } catch (err) {
          console.error('Profile lookup failed, falling back to local cache:', err);
          // fall through to the local-storage check below
        }
      }

      // No Telegram user id, or the server check failed - fall back to
      // whatever was last saved on this device.
      if (cached) {
        switchTab('home');
      } else {
        switchTab('profile');
      }
    }

    applyMode();
    applyTheme();
    applyLanguage();
    renderProfile();
    updateContinueButtonState();
    loadMyProfile();
  </script>
</body>
