{% extends "base.html" %}
{% block content %}
<div class="screen" style="display:flex; align-items:center; justify-content:center; min-height:70vh;">
  <div class="match-card">
    <h2>{{ t('its_a_match') }}</h2>
    <div class="match-avatars">
      <div class="av" style="background:{{ logged_in_user.avatar_color }};">{{ logged_in_user.name[0]|upper }}</div>
      <div class="av" style="background:{{ other.avatar_color }};">{{ other.name[0]|upper }}</div>
    </div>
    <p>{{ t('match_sub', name=other.name) }}</p>
    <div class="btnrow">
      <a class="btn-primary" href="{{ url_for('matches') }}">{{ t('send_message') }}</a>
      <a class="btn-ghost" href="{{ url_for('discover') }}">{{ t('keep_swiping') }}</a>
    </div>
  </div>
</div>
{% endblock %}
