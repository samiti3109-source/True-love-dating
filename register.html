{% extends "base.html" %}
{% block content %}
<div class="screen auth-screen">
  <h1 class="page-title">{{ t('register') }}</h1>
  <form method="POST">
    <div class="field">
      <label>{{ t('username') }}</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="field">
      <label>{{ t('password') }}</label>
      <input type="password" name="password" required>
    </div>
    <div class="field">
      <label>{{ t('name') }}</label>
      <input type="text" name="name" required>
    </div>
    <div class="field">
      <label>{{ t('age') }}</label>
      <input type="number" name="age" min="18" max="99" value="18">
    </div>
    <div class="field">
      <label>{{ t('gender') }}</label>
      <div class="gender-row">
        <label><input type="radio" name="gender" value="male" checked> {{ t('male') }}</label>
        <label><input type="radio" name="gender" value="female"> {{ t('female') }}</label>
      </div>
    </div>
    <button class="btn-primary" style="width:100%;" type="submit">{{ t('create_account') }}</button>
  </form>
  <a class="switch-link" href="{{ url_for('login') }}">{{ t('already_have_account') }}</a>
</div>
{% endblock %}
