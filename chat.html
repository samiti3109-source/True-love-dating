{% extends "base.html" %}
{% block content %}
<div class="chat-thread">
  <div class="chat-header">
    <a class="back" href="{{ url_for('matches') }}">←</a>
    <div class="avatar-sm" style="background:{{ other.avatar_color }}; width:40px; height:40px; font-size:15px;">{{ other.name[0]|upper }}</div>
    <div style="font-weight:700;">{{ other.name }}</div>
  </div>
  <div class="chat-msgs">
    {% for msg in msgs %}
      <div class="msg {{ 'me' if msg.sender_id == logged_in_user.id else 'them' }}">{{ msg.text }}</div>
    {% endfor %}
  </div>
  <form class="chat-input" method="POST" action="{{ url_for('chat', match_id=match_id) }}">
    <input type="text" name="text" placeholder="{{ t('type_message') }}" autocomplete="off" required>
    <button type="submit">➤</button>
  </form>
</div>
{% endblock %}
