{% extends "base.html" %}
{% block content %}
<div class="screen auth-screen">
  <h1 class="page-title">{{ t('login') }}</h1>
  <form method="POST">
    <div class="field">
      <label>{{ t('username') }}</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="field">
      <label>{{ t('password') }}</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn-primary" style="width:100%;" type="submit">{{ t('login') }}</button>
  </form>
  <a class="switch-link" href="{{ url_for('register') }}">{{ t('need_account') }}</a>
</div>
{% endblock %}
